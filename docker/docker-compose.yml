version: "3.9"

services:

  api:
    build: .
    container_name: companiesnext_agent

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - mysql

    volumes:
      - .:/app

    restart: unless-stopped

  mysql:
    image: mysql:8.0

    container_name: mysql_db

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: chatbot

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: