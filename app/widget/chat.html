<!-- Floating launcher -->
<button id="chat-toggle" class="cnai-toggle" type="button" aria-label="Open chat" aria-expanded="false" aria-controls="chat-window">
    <svg class="cnai-icon-open" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" />
        <circle cx="8" cy="11" r="1.3" />
        <circle cx="12" cy="11" r="1.3" />
        <circle cx="16" cy="11" r="1.3" />
    </svg>
    <svg class="cnai-icon-close" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" />
    </svg>
</button>

<!-- Chat window -->
<div id="chat-window" class="cnai-window" role="dialog" aria-modal="false" aria-labelledby="cnai-heading">

    <div class="cnai-header">
        <div class="cnai-title">
            <div class="cnai-avatar" aria-hidden="true">
                <svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="12" rx="4" /><circle cx="9.5" cy="13" r="1.5" /><circle cx="14.5" cy="13" r="1.5" /><path d="M12 7V4M12 4h.01" /></svg>
            </div>
            <div class="cnai-title-text">
                <h4 id="cnai-heading" class="cnai-heading">AI Assistant</h4>
                <span class="cnai-status"><span class="cnai-status-dot"></span>Online · replies instantly</span>
            </div>
        </div>

        <button id="chat-close" class="cnai-close" type="button" aria-label="Close chat">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
    </div>

    <div class="cnai-body">

        <!-- Lead capture form -->
        <form id="cnai-lead-form" class="cnai-lead-form" novalidate>

            <div class="cnai-lead-intro">
                <p class="cnai-lead-title">Hi there 👋</p>
                <p class="cnai-lead-text">Share a few details so we can follow up if needed, then ask us anything.</p>
            </div>

            <div class="cnai-field">
                <label class="cnai-label" for="cnai-name">Name</label>
                <input id="cnai-name" class="cnai-lead-input" type="text" placeholder="Your full name" autocomplete="name" maxlength="100" />
            </div>

            <div class="cnai-field">
                <label class="cnai-label" for="cnai-email">Email</label>
                <input id="cnai-email" class="cnai-lead-input" type="email" placeholder="you@example.com" autocomplete="email" maxlength="254" />
            </div>

            <div class="cnai-field">
                <label class="cnai-label" for="cnai-contact">Phone number</label>
                <div class="cnai-contact-row">

                    <div id="cnai-country-picker" class="cnai-country-picker">
                        <button id="cnai-country-toggle" class="cnai-country-toggle" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Select country code">
                            <span id="cnai-country-flag" class="cnai-country-flag"></span>
                            <span class="cnai-country-caret" aria-hidden="true">▾</span>
                        </button>

                        <div id="cnai-country-dropdown" class="cnai-country-dropdown">
                            <input id="cnai-country-search" class="cnai-country-search" type="text" placeholder="Search country or code" autocomplete="off" aria-label="Search countries" />
                            <ul id="cnai-country-list" class="cnai-country-list" role="listbox"></ul>
                        </div>
                    </div>

                    <div class="cnai-contact-input-wrap">
                        <span id="cnai-dial-code" class="cnai-dial-code">+91</span>
                        <input id="cnai-contact" class="cnai-contact-input" type="tel" inputmode="numeric" maxlength="14" placeholder="Mobile number" autocomplete="tel-national" />
                    </div>

                </div>
            </div>

            <div id="cnai-lead-error" class="cnai-lead-error" role="alert"></div>

            <button id="cnai-lead-submit" class="cnai-lead-submit" type="submit">Start chat</button>

            <p class="cnai-privacy">We only use your details to respond to your enquiry.</p>
        </form>

        <!-- Conversation -->
        <div id="cnai-messages" class="cnai-messages" role="log" aria-live="polite" aria-relevant="additions"></div>

        <div id="cnai-suggestions" class="cnai-suggestions" hidden></div>

    </div>

    <div class="cnai-footer">
        <form id="cnai-composer" class="cnai-composer">
            <textarea id="chat-input" class="cnai-input" rows="1" placeholder="Type your message…" aria-label="Message" disabled></textarea>
            <button id="cnai-send" class="cnai-send" type="submit" aria-label="Send message" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 16-2-7-8-1z" /></svg>
            </button>
        </form>
        <div class="cnai-footer-meta">
            <span class="cnai-hint">AI can make mistakes. Shift + Enter for a new line.</span>
            <span id="cnai-counter" class="cnai-counter" hidden></span>
        </div>
    </div>

</div>
