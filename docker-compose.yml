services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: web-agent

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      redis:
        condition: service_healthy

      qdrant:
        condition: service_started

    restart: unless-stopped

  redis:
    image: redis:7-alpine

    container_name: web-agent-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest

    container_name: web-agent-qdrant

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

    restart: unless-stopped


volumes:
  redis_data:
  qdrant_data: