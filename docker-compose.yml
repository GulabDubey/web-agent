services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: web-agent

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      qdrant:
        condition: service_started

    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest

    container_name: web-agent-qdrant

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

    restart: unless-stopped


volumes:
  qdrant_data: